name: Web (GitHub Pages)

# Publica la versión web (web/dist) en GitHub Pages con cada cambio en main
# y cada hora, con los datos del agua y del viento al día (scripts/agua y scripts/viento).
# Hay que activarlo una vez: Settings → Pages → Source: "GitHub Actions".
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '25 * * * *'

# El trabajo que compila y descarga datos solo puede leer el repositorio;
# los permisos para publicar son solo del trabajo que despliega.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build:web
      # Embalses (MITECO) y lluvia por cuenca (radar OPERA). Parte del estado
      # publicado en la hora anterior; si algo falla, se conservan esos datos.
      - name: Datos del agua
        continue-on-error: true
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          # Histórico de los pluviómetros: más tramos por ejecución, porque el horario de
          # GitHub lanza la tarea cada pocas horas y no cada hora.
          HIST_CHUNKS: '60'
          HIST_BUDGET_S: '600'
        run: |
          SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          node --max-old-space-size=6144 scripts/agua/datos.mjs web/dist/agua "$SITE/agua"
      # Viento para el modo «Viento»: ECMWF, ICON-EU (DWD) y GFS (NOAA). Si la
      # pasada de un modelo no ha cambiado, o su fuente no responde, se copia la ya publicada.
      - name: Datos del viento
        continue-on-error: true
        run: |
          SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          node scripts/viento/datos.mjs web/dist/viento "$SITE/viento"
      - name: Conservar los datos anteriores si no se generaron
        if: hashFiles('web/dist/agua/agua.json') == ''
        run: |
          SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          mkdir -p web/dist/agua
          curl -fsS -o web/dist/agua/agua.json "$SITE/agua/agua.json" || true
          curl -fsS -o web/dist/agua/estado.json "$SITE/agua/estado.json" || true
          curl -fsS -o web/dist/agua/pluvio.json "$SITE/agua/pluvio.json" || true
          mkdir -p web/dist/agua/pluvio
          # Los dos archivos de pluviómetros (el histórico tarda días en rellenarse): con reintentos, y sin ellos la próxima ejecución empezaría de cero.
          curl -fsS --retry 4 --retry-delay 5 -o web/dist/agua/pluvio/archivo.json.gz "$SITE/agua/pluvio/archivo.json.gz" || true
          curl -fsS --retry 4 --retry-delay 5 -o web/dist/agua/pluvio/historico.json.gz "$SITE/agua/pluvio/historico.json.gz" || true
          if [ -f web/dist/agua/pluvio.json ]; then
            node -p "require('./web/dist/agua/pluvio.json').stations.map((s) => s[0]).join('\n')" | xargs -P 16 -I{} curl -fsS -o "web/dist/agua/pluvio/{}.json" "$SITE/agua/pluvio/{}.json" || true
          fi
          mkdir -p web/dist/agua/embalses
          for id in $(node -p "require('./src/shared/cuencas.js').basins.map((b) => b.id).join(' ')"); do
            curl -fsS -o "web/dist/agua/embalses/$id.json" "$SITE/agua/embalses/$id.json" || true
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
